<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page not found — exyn</title>
  <meta name="theme-color" content="#0a0a0c">
  <style>
    :root {
      color-scheme: dark;
      --gold: #d8b45a;
      --cream: #f7e9de;
      --dim: #b9bec6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(90% 70% at 10% 70%, rgba(156, 35, 49, .35), transparent 60%),
        #0a0a0c;
      color: var(--cream);
      font-family: "Segoe UI", system-ui, sans-serif;
      text-align: center;
    }

    .card {
      max-width: 520px;
      padding: 44px 32px;
      border: 1px solid rgba(216, 180, 90, .3);
      border-radius: 12px;
      background: rgba(18, 18, 21, .72);
    }

    .diamond {
      width: 54px;
      height: 54px;
      margin: 0 auto 22px;
      background: var(--gold);
      clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
    }

    h1 {
      margin: 0 0 12px;
      font-family: Georgia, serif;
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-style: italic;
    }

    p {
      margin: 0 0 24px;
      color: var(--dim);
      line-height: 1.7;
      font-size: .95rem;
    }

    a {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 4px;
      background: var(--gold);
      color: #16060a;
      font-weight: 800;
      text-decoration: none;
    }

    a:hover {
      filter: brightness(1.1);
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="diamond" aria-hidden="true"></div>
    <h1>This page slipped away</h1>
    <p>The link is broken, moved, or never existed. The rest of the site is still here.</p>
    <a href="https://pecellc.github.io/esyn/">Back to exyn</a>
  </main>
</body>

</html>
